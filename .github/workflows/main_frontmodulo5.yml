name: Build and deploy React frontend to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Build frontend
        run: |
          npm install
          npm run build

      - name: Prepare Azure package
        run: |
          mkdir -p deploy
          cp -R dist/. deploy/
          cat > deploy/package.json <<'EOF'
          {
            "name": "curadoria-frontend-deploy",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "serve -s . -l ${PORT:-8080}"
            },
            "dependencies": {
              "serve": "14.2.4"
            }
          }
          EOF

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A6F771CBAC7E46BDAF2A786ED18316AC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EEAF93D28A1F4AC7828B1AA191C9AC42 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2EF641C827E9486580A02F46C717B281 }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: frontmodulo5
          slot-name: Production
          package: ./deploy
