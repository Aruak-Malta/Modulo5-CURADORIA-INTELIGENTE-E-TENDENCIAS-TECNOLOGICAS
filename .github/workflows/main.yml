name: CI/CD Pipeline - Frontend Docker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: FrontModulo5
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/aruak-malta/modulo5-curadoria-inteligente-e-tendencias-tecnologicas

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Testes automáticos
        run: npm test

      - name: Verificar vulnerabilidades das dependências
        run: npm audit --audit-level=high

      - name: Build do frontend
        run: npm run build

      - name: Validar build da imagem Docker
        run: docker build --build-arg VITE_API_URL="${VITE_API_URL}" --tag frontend-under-test .
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  publish-image:
    needs: lint-test-build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicação da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: publish-image
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A6F771CBAC7E46BDAF2A786ED18316AC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EEAF93D28A1F4AC7828B1AA191C9AC42 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2EF641C827E9486580A02F46C717B281 }}

      - name: Configurar acesso do App Service ao GHCR
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          if [ -z "$GHCR_READ_TOKEN" ]; then
            echo "::error::Configure o secret GHCR_READ_TOKEN com um token que tenha acesso de leitura ao pacote."
            exit 1
          fi

          RESOURCE_GROUP=$(az webapp list \
            --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" \
            --output tsv)
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::Não foi possível localizar o App Service ${AZURE_WEBAPP_NAME} na assinatura autenticada."
            exit 1
          fi

          az webapp config appsettings set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings \
              WEBSITES_PORT=8080 \
              DOCKER_REGISTRY_SERVER_URL="https://${REGISTRY}" \
              DOCKER_REGISTRY_SERVER_USERNAME="${GITHUB_REPOSITORY_OWNER}" \
              DOCKER_REGISTRY_SERVER_PASSWORD="$GHCR_READ_TOKEN" \
            --output none

      - name: Deploy da imagem no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          images: ${{ env.IMAGE_NAME }}:${{ github.sha }}
